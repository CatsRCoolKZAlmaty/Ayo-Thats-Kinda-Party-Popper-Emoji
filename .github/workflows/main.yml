name: Build redirect blocklist

on:
  push:
    paths:
      - blocklist.txt
      - scripts/build_redirect_list.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate redirect blocklist
        run: python scripts/build_redirect_list.py

      - name: Commit generated file
        run: |
          if git diff --quiet -- blocklistredirect.txt; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blocklistredirect.txt
          git commit -m "Update generated redirect blocklist"
          git push
